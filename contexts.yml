# The bounded contexts of the API Commons common schema, in the order they are being
# distilled. Each one is its own repository under api-commons, built by the scripts in
# this one. status: published | built (local, not yet public) | planned
contexts:
- context: crm
  name: Customer Relationship Management
  repo: api-commons/crm
  status: published
  tags: [CRM, Customer Relationship Management]
  concepts: [contact, company, deal, lead, activity, task, note, pipeline]
- context: ticketing
  name: Help Desk and Ticketing
  repo: api-commons/ticketing
  status: published
  tags: [Customer Service, Help Desk, ITSM, Customer Support, Service Desk, IT Support, Support]
  concepts: [ticket, ticket_message, requester, agent, group, organization]
- context: commerce
  name: Commerce
  repo: api-commons/commerce
  status: published
  tags: [E-Commerce, Commerce, Headless Commerce, Composable Commerce, B2B Commerce, Storefront, Order Management]
  concepts: [product, product_variant, category, customer, cart, order, order_item, shipment, inventory]
- context: payments
  name: Payments
  repo: api-commons/payments
  status: built
  tags: [Payments, Payment Processing]
  # checkout sessions were handed over from commerce, where /checkout is a hosted payment
  concepts: [payment, checkout_session, refund, customer, payment_method, payout, dispute]
- context: card-issuing
  name: Card Issuing
  status: planned
  tags: [Card Issuing]
  # handed over from payments, where /cards and /tokens were issued cards, not payment methods
  concepts: [card, cardholder, authorization, card_program, spending_control]
- context: billing
  name: Billing and Invoicing
  status: planned
  tags: [Billing, Invoicing, Subscriptions, Accounting]
  concepts: [invoice, subscription, plan, price, credit_note, ledger_account]
- context: messaging
  name: Messaging (Email, SMS, Chat)
  status: planned
  tags: [Email, SMS, Messaging, Communications]
  concepts: [message, recipient, template, conversation, attachment]
- context: scheduling
  name: Calendars and Scheduling
  status: planned
  tags: [Calendar, Scheduling, Appointments]
  concepts: [event, calendar, attendee, availability, booking]
- context: hris
  name: People and HR
  status: planned
  tags: [HR, HRIS, Human Resources, Payroll, Recruiting]
  concepts: [employee, department, time_off, job, candidate, application]
- context: files
  name: Files and Documents
  status: planned
  tags: [File Storage, Documents, Content Management]
  concepts: [file, folder, permission, version]
- context: identity
  name: Identity and Users (cross-cutting)
  status: planned
  tags: [Identity, Authentication, User Management]
  concepts: [user, organization, team, role, membership]
