#
# The API Commons naming ruleset.
#
# The common schema in every API Commons bounded context is written to these rules, and
# any provider can point it at their own OpenAPI to see how far their naming sits from
# the common vocabulary. Every rule cites what the market measurably does; where the
# market is split, the rule says so and the severity drops to info.
#
# Measured across every built context (Customer Relationship Management, Help Desk and Ticketing, Commerce, Payments, Card Issuing, Billing and Invoicing, Messaging (Email, SMS, Chat), Calendars and Scheduling, People and HR, Payroll, Recruiting, Files and Documents, Identity and Users, E-Signature, Accounting, Banking, Lending, Insurance, Property Management, Travel and Lodging, Shipping, Fleet and Telematics, Project Management, Content Management, Email Marketing, Advertising, Product Analytics, Observability, Incident Management, CI/CD, Source Control, Cloud Infrastructure, Vulnerability Management, Identity Verification, Healthcare, Learning Management, Food Ordering, Point of Sale, Loyalty, Events and Ticketing, Video, Maps and Geocoding, Weather, Market Data, Trading, Crypto Wallets, Search, Forms and Surveys, Reviews, Social Media, Telephony, Contact Center, Workflow Automation, Knowledge Base, Procurement, IoT Devices, EV Charging, Webhooks, Audit Logs, Feature Flags, API Management, Secrets Management, DNS and Domains, CDN and Edge, AI Agents, Document AI, Data Enrichment, Tax, Legal Practice, Contract Lifecycle, Expense Management, Time Tracking, Field Service, IT Asset Management, ITSM Change and CMDB, Customer Success, Sales Engagement, Configure, Price, Quote, Affiliates and Partners, Nonprofit Fundraising, Membership, Marketplace, Returns, Warehouse Management, Freight and TMS, Gift Cards, Subscription Commerce, Privacy and Consent, Background Checks, Open Data Catalogs, Research Repositories, News, Music, Podcasts, Books and Publishing, Translation and Localization, Speech and Transcription, Energy and Utilities, Solar and Energy Storage, Agriculture, Automotive, Mobility and Ride-Hailing, Parking, Sports Data, Gaming, Fitness and Wellness, Genomics and Clinical Trials: 6688 providers' own
# harvested OpenAPI). Counts are PROVIDERS, not files, with catalog duplicates folded.
# GENERATED: edit schema-commons-naming.template.yaml, then run scripts/naming-evidence.py,
# which re-measures and renders this file. Do not edit the numbers here by hand.
#
# WHAT THIS DOES NOT DO
#   - Rename anything. The crosswalk in each context maps a provider's names to the
#     common ones; nothing here asks a provider to break their clients.
#   - Judge meaning. Two fields with the same name can still mean different things --
#     that is the alias file's job (concepts.yml), reviewed by a person.
#
# Built-in functions only, so it runs in OpenLint, Spectral and the browser validator.
formats: [oas2, oas3]

rules:

  commons-property-snake-case:
    description: >-
      Property names are snake_case. Single-word names (id, name, email) are the most common
      form of all (3639 providers) and satisfy every convention. Among multi-word
      names the market is evenly split -- camelCase 1894 providers,
      snake_case 1880 -- so the count cannot decide it. The commons uses
      snake_case because it has one spelling for an acronym (customer_id, never customerID
      or customerId) and the crosswalk carries camelCase names without loss. A decision,
      recorded as one.
    message: "{{property}} is not snake_case (the common vocabulary's casing)."
    severity: info
    # Extension keys (x-...) are annotations, not properties -- they appear under a property
    # literally named "properties" (an analytics event's), which $..properties also matches.
    given: "$..properties[?(!@property.match(/^x-/))]~"
    then:
      function: casing
      functionOptions: {type: snake}

  commons-path-segment-kebab-case:
    description: >-
      Literal path segments are lowercase, words separated by hyphens. Lowercase single words
      are used by 6310 providers; for multi-word segments kebab-case (3413) leads
      snake_case (1791) and camelCase (1288).
    message: "Path {{property}} has a segment that is not lowercase kebab-case."
    severity: warn
    given: "$.paths"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^(/([a-z0-9]+(-[a-z0-9]+)*|\\{[^}]+\\}|v[0-9][a-z0-9.]*))*/?$"

  commons-collection-plural:
    description: >-
      A collection is named with a plural noun (/contacts, not /contact). 3646 providers name
      collections in the plural, 1953 use a singular somewhere.
    message: "Collection path {{property}} ends in a singular segment."
    severity: info
    given: "$.paths"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "/(contact|company|deal|lead|activity|task|note|pipeline|person|organization|account|opportunity)$"

  commons-path-param-snake-case:
    description: >-
      Path parameters are snake_case and name the thing they identify ({contact_id}). A
      bare {id} is the most common single form (3724 providers) and passes; camelCase (2846)
      and snake_case (2134) are both common among multi-word names, so this is info, not a warning.
    message: "Path {{property}} has a parameter that is not snake_case."
    severity: info
    given: "$.paths"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "\\{[^}]*[A-Z-][^}]*\\}"

  commons-query-param-snake-case:
    description: >-
      Query parameters are snake_case. Lowercase single words are used by 5130 providers;
      snake_case (2757) and camelCase (2750) are
      near-even among multi-word names.
    message: "Query parameter {{value}} is not snake_case."
    severity: info
    given: "$.paths[*][*].parameters[?(@.in == 'query')].name"
    then:
      function: casing
      functionOptions: {type: snake}

  commons-timestamp-at-suffix:
    description: >-
      Timestamps end in _at (created_at, updated_at). 1338 providers use the _at form,
      613 a bare created/updated, 360 a _date, _time or "on" suffix (createdon, add_time).
    message: "{{property}} looks like a timestamp; the common form is created_at / updated_at."
    severity: warn
    given: "$..properties"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "^(created|updated|modified|deleted)(_?(date|time|on|On|Date|Time))?$|^(add|update|create|modify)_?[tT]ime$|^date_?(created|modified|updated)$"

  commons-pagination-limit-cursor:
    description: >-
      Page with limit and cursor. limit is the most common paging parameter (2538 providers),
      ahead of page (1805) and page_size (1134); cursor (709) is the most common continuation
      token. Offset paging is fine; this flags the long tail of synonyms.
    message: "{{value}} is a paging synonym; the common pair is limit + cursor."
    severity: info
    given: "$.paths[*][*].parameters[?(@.in == 'query')].name"
    then:
      function: pattern
      functionOptions:
        notMatch: "^(per_page|perPage|page_size|pageSize|top|\\$top|skip|\\$skip|max_results|maxResults|size|page_token|pageToken)$"

  commons-foreign-key-id-suffix:
    description: >-
      A reference to another resource is named <resource>_id (company_id, owner_id).
      camelCase ...Id is used by 1479 providers and snake_case _id by
      1388; the commons follows commons-property-snake-case.
    message: "{{property}} is a reference; the common form is <resource>_id."
    severity: info
    given: "$..properties"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "[a-z0-9](Id|ID)$"
