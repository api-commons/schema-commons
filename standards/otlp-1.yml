standard: otlp-1
source: https://github.com/open-telemetry/opentelemetry-proto
format: otlp
note: Field names extracted from the standard's own published definition by scripts/extract-standard.py; nothing here comes
  from a provider's spec.
objects:
  TracesData:
  - resource_spans
  ResourceSpans:
  - resource
  - scope_spans
  - schema_url
  ScopeSpans:
  - scope
  - spans
  - schema_url
  Span:
  - trace_id
  - span_id
  - trace_state
  - parent_span_id
  - flags
  - name
  - kind
  - start_time_unix_nano
  - end_time_unix_nano
  - attributes
  - dropped_attributes_count
  - events
  - dropped_events_count
  - links
  - dropped_links_count
  - status
  Status:
  - message
  - code
  LogsData:
  - resource_logs
  ResourceLogs:
  - resource
  - scope_logs
  - schema_url
  ScopeLogs:
  - scope
  - log_records
  - schema_url
  LogRecord:
  - time_unix_nano
  - observed_time_unix_nano
  - severity_number
  - severity_text
  - body
  - attributes
  - dropped_attributes_count
  - flags
  - trace_id
  - span_id
  - event_name
