  - accessLevel
  - rights
  - accrualPeriodicity
  - bureauCode
  - contactPoint
  - describedBy
  - describedByType
  - conformsTo
  - dataQuality
  - description
  - distribution
  - identifier
  - issued
  - keyword
  - landingPage
  - language
  - license
  - modified
  - primaryITInvestmentUII
  - programCode
  - publisher
  - references
  - spatial
  - systemOfRecords
  - temporal
  - isPartOf
  - theme
  - title
  distribution:
  - downloadURL
  - mediaType
  - format
  - accessURL
  - description
  - title
  - conformsTo
  - describedBy
  - describedByType
