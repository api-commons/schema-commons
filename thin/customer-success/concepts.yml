context: customer-success
name: Customer Success
intro: >-
  The common customer-success vocabulary -- the health scores that say how an account is doing,
  the NPS and satisfaction responses behind them, the success plans and playbooks that act on
  them -- distilled from the APIs that already exist. Accounts and contacts belong to CRM.
tags: [Customer Success, Customer Retention, Churn, Churn Prevention, Customer Health, NPS, Customer Experience, CSAT]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, gsid, external_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, submitted_at, responded_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, stage, plan_status]
  name: [title, display_name, label]
  account_id: [account, company_id, company, customer_id, customer, organization_id]
  owner_id: [owner, csm_id, csm, assigned_to, assignee_id, user_id]

concepts:
  health_score:
    path: /health-scores
    segments: [health_scores, health-scores, healthscores, scores@health|accounts|customers|companies, scorecards, health]
    aliases:
      score: [value, health, health_score, overall_score, total_score, rating]
      trend: [change, direction, delta, previous_score]
      category: [grade, color, label, band]
  nps_response:
    path: /nps-responses
    segments: [nps, nps_responses, nps-responses, survey_responses@nps|csat, responses@nps|csat, csat, csat_responses, ratings@satisfaction]
    aliases:
      score: [rating, value, nps_score, csat_score]
      comment: [feedback, text, verbatim, reason]
      respondent_id: [respondent, contact_id, person_id, user_id, email]
  success_plan:
    path: /success-plans
    segments: [success_plans, success-plans, successplans, ctas, cta, objectives@accounts|success, plans@success|accounts, milestones@success]
    aliases:
      due_date: [due_at, due, target_date]
      type: [plan_type, cta_type, reason, category]
  playbook:
    segments: [playbooks, playbook, journeys@success|customer, cadences@success]
    aliases:
      steps: [tasks, actions, step_count]
      trigger: [triggers, criteria, entry_criteria]

findings:
  - "Customer success is not published as OpenAPI. Every health-score match in a 65-provider cohort
    was a `/health` service check; the success objects themselves -- CTAs, success plans -- come
    from one platform (Gainsight). No concept clears the three-provider floor."
decisions:
  - "Measured and not published: the context is recorded as `thin`, with its findings, and gets no
    repository until the market publishes enough to distil."
  - "A bare `/health` is a service health check, not a customer health score."
