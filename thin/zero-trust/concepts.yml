  id: [uuid, guid, external_id, device_id, policy_id]
  created_at: [created, created_date, create_time, enrolled_at, enrollment_date]
  updated_at: [updated, modified_at, update_time, last_seen, last_check_in, last_sync]
  status: [state]
  name: [title, display_name]

concepts:
  managed_device:
    path: /managed-devices
    segments: [devices, device, computers, mobile_devices, endpoints@mdm|devices|zt, machines]
    aliases:
      serial_number: [serial, serialnumber]
      os: [platform, os_type, operating_system, os_name]
      os_version: [platform_version, osversion]
      model: [model_name, hardware_model, device_model]
      user: [user_id, owner, assigned_user, email, user_email]
      compliant: [compliance, is_compliant, compliance_state, posture]
  access_policy:
    path: /access-policies
    segments: [policies, policy, rules@access|zt|firewall|gateway, access_policies, posture@rules|checks]
    aliases:
