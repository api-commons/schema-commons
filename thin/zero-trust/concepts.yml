context: zero-trust
name: Zero Trust and Device Posture
intro: >-
  The common zero-trust vocabulary -- managed devices and their posture, the access policies evaluated
  against them, and the protected applications -- distilled from the APIs that already exist.
tags: [Zero Trust, Device Management, MDM, Endpoint Management, Network Security, SASE, ZTNA, VPN]

envelope: [_links, _pagination, _results, data, success, errors, count, total, page, meta, links, result, results,
           value, next, previous, has_more, message, page_info, cursor, total_count, per_page, total_pages, object]

