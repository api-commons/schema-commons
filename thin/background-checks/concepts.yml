context: background-checks
name: Background Checks
intro: >-
  The common background-check vocabulary -- the screenings ordered on a person, the packages of
  checks a screening runs and the reports that come back -- distilled from the APIs that already
  exist. Candidates belong to recruiting; identity verification to its own context.
tags: [Background Checks, Background Check, Background Screening, Employment Screening, Drug Testing, Tenant Screening, Pre-Employment Screening]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id, order_id, report_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, ordered_at, submitted_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags]
  status: [state, order_status, report_status, screening_status]
  subject_id: [candidate_id, candidate, applicant_id, applicant, person_id, subject, profile_id, worker_id]

concepts:
  screening:
    segments: [screenings, screening, background_checks, background-checks, backgroundchecks, checks@background|screening, orders@screening|background, invitations@screening|background|candidates]
    aliases:
      package: [package_id, package_name, product, product_id, service_level]
      result: [adjudication, outcome, decision, assessment, score]
      completed_at: [completed, completion_date, finished_at]
      eta: [estimated_completion, estimated_completion_time]
  screening_report:
    requires: [screening]
    path: /screening-reports
    segments: [reports, report, report_results, results@screenings|orders|checks]
    aliases:
      result: [adjudication, outcome, decision, assessment]
      screenings: [searches, checks, components, report_items]
      completed_at: [completed, completion_date, finished_at]
  screening_package:
    requires: [screening]
    path: /screening-packages
    segments: [packages, package, products@screening, services@screening, packages@accounts]
    aliases:
      screenings: [searches, checks, products, components, screening_types]
      price: [cost, amount]

findings:
  - "Background screening is barely published as OpenAPI: 16 providers in the cohort, 3 exposing a
    screening, agreeing on id, status and created_at."
decisions:
  - "Measured and not published: recorded as `thin`, with its findings."
  - "Identity verification is its own context; candidates are recruiting's."
