context: privacy
name: Privacy and Consent
intro: >-
  The common privacy vocabulary -- the consent records that say what a person agreed to, and the
  data-subject requests they make to see, correct or delete their data -- distilled from the APIs
  that already exist.
tags: [Privacy, Data Privacy, Consent Management, GDPR, CCPA, Privacy Compliance, Privacy Engineering, Data Protection]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, request_id, consent_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, submitted_at, received_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, request_status, consent_status]
  subject_id: [subject, user_id, data_subject_id, identity, identifier, customer_id, email, person_id, external_id]

concepts:
  consent:
    segments: [consents, consent, consent_records, consent-records, consentrecords, "preferences@consent|privacy|users", purposes@consent, consent_receipts]
    aliases:
      purpose: [purposes, purpose_id, category, consent_type, type, topic]
      granted: [given, opted_in, accepted, value, decision, status_value]
      granted_at: [consented_at, timestamp, given_at, collected_at]
      source: [collection_point, channel, origin, collected_via]
  data_subject_request:
    path: /data-subject-requests
    segments: [data_subject_requests, data-subject-requests, dsars, dsar, dsrs, dsr, privacy_requests, privacy-requests, "requests@privacy|dsr|gdpr", erasure_requests, deletion_requests, "deletions@users|privacy"]
    aliases:
      type: [request_type, kind, action, right]
      due_date: [deadline, due_at, due, response_due]
      completed_at: [closed_at, fulfilled_at, finished_at]
      jurisdiction: [regulation, law, region]

findings:
  - "Privacy is not published in a common shape: in a 113-provider cohort, consent records appear
    at 7 providers with no shared property, and data-subject requests at one. Consent-management
    platforms deliver consent through a browser SDK and a consent string, not a REST resource."
decisions:
  - "Measured and not published: recorded as `thin`, with its findings."
  - "Email unsubscribes and suppressions are messaging's; privacy here is regulatory consent and
    data-subject rights."
