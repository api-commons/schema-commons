context: esg
name: ESG and Carbon Accounting
intro: >-
  The common carbon-accounting vocabulary -- emission estimates and the activities they are calculated
  from, emission factors, and carbon offsets -- distilled from the APIs that already exist.
tags: [ESG, Carbon Accounting, Carbon Emissions, Carbon Offsets, Sustainability, Climate Tech, Carbon Credits, Emissions]

envelope: [_links, _pagination, _results, data, success, errors, count, total, page, meta, links, result, results,
