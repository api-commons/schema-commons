context: marketplace
name: Marketplace
intro: >-
  The common marketplace vocabulary -- the sellers on a multi-vendor marketplace, the listings
  they publish and the offers they make on a shared catalog -- distilled from the APIs that
  already exist. Orders belong to commerce and seller payouts to payments.
tags: [Marketplace, Marketplaces, Online Marketplace, Multi-Vendor Marketplace, B2B Marketplace, E-Commerce]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags]
  status: [state, seller_status, listing_status, active, is_active]
  name: [title, display_name, label, shop_name, store_name]
  seller_id: [seller, vendor_id, vendor, merchant_id, shop_id, shop, store_id, partner_id]
  price: [amount, list_price, sale_price, price_amount]
  currency: [currency_code]

concepts:
  seller:
    path: /sellers
    segments: [sellers, seller, "vendors@marketplace|marketplaces|admin", "shops@marketplace|users|sellers", "merchants@marketplace|marketplaces"]
    aliases:
      email: [email_address, contact_email]
      country: [country_code, region]
      rating: [seller_rating, score, feedback_score]
  marketplace_listing:
    requires: [seller]
    path: /marketplace-listings
    segments: [listings, listing, offers, offer, "products@sellers|vendors|shops", inventory@sellers|listings]
    aliases:
      sku: [seller_sku, offer_sku, product_sku, product_id]
      quantity: [stock, available_quantity, inventory, qty]
      condition: [item_condition, state_condition]
      description: [body, details]

findings:
  - "Marketplace is not published in a common shape. Across a 468-provider cohort, sellers agree on
    nothing but an id (14 providers), and listings and offers are one marketplace's model each --
    the large marketplaces publish proprietary seller APIs, and `offers` elsewhere are loyalty,
    game-store and order-book offers."
decisions:
  - "Measured and not published: recorded as `thin`, with its findings, and given no repository
    until a shared seller or listing shape appears."
  - "Orders are commerce's and seller payouts are payments'."
